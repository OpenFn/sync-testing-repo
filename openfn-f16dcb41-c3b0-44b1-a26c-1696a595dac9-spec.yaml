          });
      numbers-trivia:
        name: numbers-trivia
        adaptor: '@openfn/language-http@latest'
        credential: null
        body: |
          // numbers-trivia QA health-check node
          // - Sends a GET request to http://numbersapi.com/random/trivia
          // - Verifies the response body is a non-empty text string of trivia
          // - Appends a result object to the shared state.qaResults array
          // - Never overwrites existing results; never throws on failure

          fn(state => {
            const name = 'numbers-trivia';
            const endpoint =
              'https://uselessfacts.jsph.pl/api/v2/facts/random?language=en';

            return get(endpoint)(state)
              .then(nextState => {
                // Success: response is JSON with a `text` field
                const body = nextState.data;
                const trivia =
                  body && typeof body.text === 'string' ? body.text.trim() : '';
                const passed = trivia.length > 0;

                const qaResults = nextState.qaResults || [];

                return {
                  ...nextState,
                  qaResults: [
                    ...qaResults,
                    { name, endpoint, passed, detail: trivia },
                  ],
                };
              })
              .catch(error => {
                // Failure: never throw, append a passed:false entry
                let detail;
                if (error && error.statusCode) {
                  detail = `HTTP ${error.statusCode} ${error.statusMessage || ''}`.trim();
                  if (error.body) {
                    detail += `: ${
                      typeof error.body === 'string'
                        ? error.body
                        : JSON.stringify(error.body)
                    }`;
                  }
                } else {
                  detail = (error && error.message) || String(error);
                }

                const qaResults = state.qaResults || [];

                return {
                  ...state,
                  qaResults: [
                    ...qaResults,
                    { name, endpoint, passed: false, detail },
                  ],
                };
              });
          });
      public-holidays:
        name: public-holidays
        adaptor: '@openfn/language-http@latest'
        credential: null
        body: |
          // QA health-check node: public-holidays
          // Sends a GET request to the Nager.Date public holidays API for US 2024.
          // Verifies the response is a non-empty array where each holiday has a date and name.
          // Appends a pass/fail result to the shared state.qaResults array without overwriting existing entries.
          // Any HTTP or network failure is caught and recorded - it never aborts the run.

          fn(state => {
            const endpoint = 'https://date.nager.at/api/v3/PublicHolidays/2024/US';

            return get(endpoint)(state)
              .then(s => {
                const holidays = s.data;

                const passed =
                  Array.isArray(holidays) &&
                  holidays.length > 0 &&
                  holidays.every(h => h && h.date && h.name);

                const result = {
                  name: 'public-holidays',
                  endpoint,
                  passed,
                  detail: Array.isArray(holidays) ? holidays.length : 0,
                };

                const qaResults = s.qaResults || [];

                return { ...s, qaResults: [...qaResults, result] };
              })
              .catch(error => {
                const resp = error.response;
                let detail;

                if (resp) {
                  const status = resp.status ?? resp.statusCode ?? '';
                  const message = resp.statusText ?? resp.statusMessage ?? '';
                  const body = resp.data ?? resp.body;
                  const bodyStr =
                    body == null
                      ? ''
                      : typeof body === 'string'
                      ? body
                      : JSON.stringify(body);
                  detail = `HTTP ${status} ${message}`.trim();
                  if (bodyStr) detail += ` - ${bodyStr}`;
                } else {
                  detail = error.message || String(error);
                }

                const result = {
                  name: 'public-holidays',
                  endpoint,
                  passed: false,
                  detail,
                };

                const qaResults = state.qaResults || [];

                return { ...state, qaResults: [...qaResults, result] };
              });
          });
      cat-fact:
        name: cat-fact
        adaptor: '@openfn/language-http@latest'
        credential: null
        body: |
          // QA health-check: cat-fact
          // GET https://catfact.ninja/fact
          // Verifies the response contains a non-empty 'fact' string.
          // Appends a result object to state.qaResults (never overwrites existing entries).
          // Records passed:false on failure instead of throwing.

          fn(state => {
            const name = 'cat-fact';
            const endpoint = 'https://catfact.ninja/fact';

            return get(endpoint)(state)
              .then(nextState => {
                const fact = nextState.data && nextState.data.fact;
                const passed = typeof fact === 'string' && fact.trim().length > 0;

                const result = {
                  name,
                  endpoint,
                  passed,
                  detail: passed ? fact.slice(0, 200) : 'No valid fact returned',
                };

                const qaResults = nextState.qaResults || [];
                return { ...nextState, qaResults: [...qaResults, result] };
              })
              .catch(error => {
                let detail;
                if (error.response) {
                  const { status, statusText, data } = error.response;
                  const body =
                    data == null
                      ? ''
                      : ` - body: ${
                          typeof data === 'string' ? data : JSON.stringify(data)
                        }`;
                  detail = `HTTP ${status} ${statusText || ''}`.trim() + body;
                } else {
                  detail = `Network error: ${error.message}`;
                }

                const result = { name, endpoint, passed: false, detail };
                const qaResults = state.qaResults || [];
                return { ...state, qaResults: [...qaResults, result] };
              });
          });
      iss-location:
        name: iss-location
        adaptor: '@openfn/language-http@latest'
        credential: null
        body: |
          // iss-location: QA health-check node
          // Sends a GET request to the Open Notify ISS location API
          // Verifies the response message is 'success' and includes an iss_position with latitude/longitude
          // Appends a pass/fail result to the shared state.qaResults array (never overwrites existing entries)
          // The request is wrapped so any failure (non-2xx or network error) is caught and recorded, never thrown

          fn(state => {
            const endpoint = 'https://api.wheretheiss.at/v1/satellites/25544';
            const qaResults = state.qaResults || [];

            const appendResult = result => ({
              ...state,
              qaResults: [...qaResults, result],
            });

            return get(endpoint)(state)
              .then(next => {
                const body = next.data || {};

                const passed = body.latitude != null && body.longitude != null;

                return appendResult({
                  name: 'iss-location',
                  endpoint,
                  passed,
                  detail: `latitude=${body.latitude}, longitude=${body.longitude}`,
                });
              })
              .catch(error => {
                const response = error.response;
                let detail;

                if (response) {
                  // Non-2xx HTTP response: include status code, status message and body
                  const body =
                    typeof response.body === 'string'
                      ? response.body
                      : JSON.stringify(response.body);
                  detail = `HTTP ${response.statusCode} ${
                    response.statusMessage || ''
                  }`.trim();
                  if (body) detail += ` - ${body}`;
                } else {
                  // Network / other failure: use the error message
                  detail = `Network error: ${error.message}`;
                }

                return appendResult({
                  name: 'iss-location',
                  endpoint,
                  passed: false,
                  detail,
                });
              });
          });
      bored-activity:
        name: bored-activity
        adaptor: '@openfn/language-http@latest'
        credential: null
        body: |
          // QA health-check node: bored-activity
          // - Sends a GET request to the Bored API activity endpoint
          // - Verifies the response contains a non-empty 'activity' string
          // - Appends a pass/fail result object to the shared state.qaResults array
          // - Never throws on request or assertion failure; records passed:false instead

          fn(state => {
            const name = 'bored-activity';
            const endpoint = 'https://bored-api.appbrewery.com/random';
            const qaResults = state.qaResults || [];

            return get(endpoint)(state)
              .then(nextState => {
                // Success: keep the existing check logic
                const activity = nextState.data && nextState.data.activity;
                const passed =
                  typeof activity === 'string' && activity.trim().length > 0;

                return {
                  ...nextState,
                  qaResults: [
                    ...qaResults,
                    { name, endpoint, passed, detail: activity },
                  ],
                };
              })
              .catch(error => {
                // Failure: build a full explanation, never throw
                let detail;
                const response = error.response || (error.body && error);

                if (response && (response.statusCode || response.status)) {
                  const statusCode = response.statusCode || response.status;
                  const statusMessage = response.statusMessage || '';
                  const body = response.body ?? response.data;
                  const bodyText =
                    body === undefined || body === null
                      ? ''
                      : typeof body === 'string'
                      ? body
                      : JSON.stringify(body);
                  detail = `HTTP ${statusCode} ${statusMessage}`.trim();
                  if (bodyText) detail += ` - ${bodyText}`;
                } else {
                  // Network / non-HTTP failure
                  detail = error.message || String(error);
                }

                return {
                  ...state,
                  qaResults: [
                    ...qaResults,
                    { name, endpoint, passed: false, detail },
                  ],
                };
              });
          });
      intentional-fail:
        name: intentional-fail
        adaptor: '@openfn/language-http@latest'
        credential: null
        body: |
          // QA health-check node: intentional-fail
          // A deliberately-failing check that proves the failure-reporting path works.
          // It performs no real request - it simply records a synthetic failure.
          // Does not throw and completes successfully so the chain continues on on_job_success.

          fn(state => {
            const name = 'intentional-fail';
            const endpoint = 'n/a - deliberate failure';
            const qaResults = state.qaResults || [];

            qaResults.push({
              name,
              endpoint,
              passed: false,
              detail:
                'Intentional/synthetic failure. This check always reports passed:false ' +
                'to verify that the QA failure-reporting and notification path works end to end. ' +
                'No external system was called and no error was thrown.',
            });

            return { ...state, qaResults };
          });
