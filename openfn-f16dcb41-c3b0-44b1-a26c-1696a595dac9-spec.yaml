  OpenFn-Platform-Test-Workflow-1:
    name: OpenFn Platform Test Workflow 1
    jobs:
      Validate-Input:
        name: Validate Input
        adaptor: '@openfn/language-common@latest'
        credential: null
        body: |
          // TEST JOB 1: Core data operations & assertions (common adaptor, no config needed)

          // 1. Generate some data into state
          fn(state => {
            const users = [
              { id: 1, name: 'alice', active: true },
              { id: 2, name: 'bob', active: false },
              { id: 3, name: 'carol', active: true },
            ];
            return { ...state, data: { users } };
          });

          // 2. Transform: map + filter active users, uppercase names
          fn(state => {
            const activeNames = state.data.users
              .filter(u => u.active)
              .map(u => u.name.toUpperCase());
            return { ...state, activeNames };
          });

          // 3. Iterate with each() to test list handling
          each(
            '$.data.users[*]',
            fn(state => {
              console.log('Processing user:', state.data.name);
              return state;
            })
          );

          // 4. PASS/FAIL criteria — run fails if any assertion is false
          fn(state => {
            assert(
              state.data.users.length === 3,
              'FAIL: expected 3 users'
            );
            assert(
              state.activeNames.length === 2,
              'FAIL: expected 2 active users'
            );
            assert(
              state.activeNames.includes('ALICE'),
              'FAIL: ALICE missing from active names'
            );
            console.log('PASS: all assertions passed for job 1');
            return state;
          });

      Make-HTTP-Request:
        name: Make HTTP Request
        adaptor: '@openfn/language-http@latest'
        credential: null
        body: |
          // HTTP adaptor test - hits httpbin.org, no credentials required

          // 1. GET request - verify we can read a response
          get('https://httpbin.org/json');
          fn(state => {
            const body = state.data;
            if (!body || !body.slideshow) {
              throw new Error('FAIL: GET did not return expected slideshow data');
            }
            console.log('PASS: GET request returned expected data');
            return state;
          });

          // 2. POST request - send data and verify it echoes back
          post('https://httpbin.org/post', {
            body: { name: 'OpenFn', test: true },
          });
          fn(state => {
            const echoed = state.data.json;
            if (!echoed || echoed.name !== 'OpenFn' || echoed.test !== true) {
              throw new Error('FAIL: POST did not echo the sent payload correctly');
            }
            console.log('PASS: POST request echoed payload correctly');

            // Verify status code
            if (state.response.statusCode !== 200) {
              throw new Error(`FAIL: expected status 200, got ${state.response.statusCode}`);
            }
            console.log('PASS: status code is 200');

            return state;
          });

      Handle-Validation-Failure:
        name: Handle Validation Failure
        adaptor: '@openfn/language-common@latest'
        credential: null
        body: |
          // Final summary step: verify results from previous jobs and report pass/fail
          fn(state => {
            // Collect a simple summary of what previous steps left on state
            const summary = {
              hasData: state.data !== undefined && state.data !== null,
              referenceCount: Array.isArray(state.references) ? state.references.length : 0,
              checkedAt: new Date().toISOString(),
            };

            console.log('Workflow test summary:', JSON.stringify(summary, null, 2));

            return { ...state, summary };
          });

          // Pass/fail criteria for the overall workflow test
          assert(
            state => state.summary.hasData === true,
            'FAIL: expected data on state from previous steps'
          );

          assert(
            state => state.summary.referenceCount >= 0,
            'FAIL: references should be an array'
          );

          fn(state => {
            console.log('PASS: all workflow test criteria met');
            return state;
          });

      Process-HTTP-Response:
        name: Process HTTP Response
        adaptor: '@openfn/language-common@latest'
        credential: null
        body: |
          // Self-contained test: exercises each, map, group, uuid, encode/decode
          fn(state => {
            // Seed some test data
            state.people = [
              { id: uuid(), name: 'Ada', team: 'A', score: 10 },
              { id: uuid(), name: 'Grace', team: 'B', score: 20 },
              { id: uuid(), name: 'Alan', team: 'A', score: 30 },
            ];
            return state;
          });

          // Test each(): iterate and tag every record
          each(
            '$.people[*]',
            fn(state => {
              state.data.processed = true;
              return state;
            })
          );

          // Test group(): group people by team
          fn(state => {
            state.grouped = group(state.people, 'team', item => item);
            return state;
          });

          // Test encode/decode round-trip
          fn(state => {
            const original = 'openfn-test';
            const encoded = encode(original);
            const decoded = decode(encoded);
            state.roundTrip = { original, encoded, decoded };
            return state;
          });

          // Pass/fail criteria
          fn(state => {
            assert(state.people.length === 3, 'Expected 3 seeded people');
            assert(
              state.people.every(p => typeof p.id === 'string' && p.id.length > 0),
              'Every person must have a uuid id'
            );
            assert(
              state.roundTrip.decoded === state.roundTrip.original,
              'encode/decode round-trip must match'
            );
            assert(
              Object.keys(state.grouped).length === 2,
              'Expected 2 groups (teams A and B)'
            );
            console.log('Job 4 passed: each/group/uuid/encode tests OK');
            return state;
          });
      Handle-HTTP-Failure:
        name: Handle HTTP Failure
        adaptor: '@openfn/language-common@latest'
        credential: null
        body: |
          // Self-contained test: CSV parsing, conditional logic, merge, validation
          // No credentials or input required.

          // 1. Parse a CSV string into structured data
          parseCsv(
            `id,name,score
          1,Alice,90
          2,Bob,75
          3,Carol,55`,
            { columns: true, skip_empty_lines: true },
            (state, rows) => {
              state.rows = rows;
              console.log(`Parsed ${rows.length} CSV rows`);
              return state;
            }
          );

          // 2. Conditionally flag passing scores (>= 60)
          fnIf(
            state => state.rows.length > 0,
            fn(state => {
              state.rows = state.rows.map(r => ({
                ...r,
                score: Number(r.score),
                passed: Number(r.score) >= 60,
              }));
              return state;
            })
          );

          // 3. Merge a static field into every row
          merge(
            state => state.rows,
            fields(field('processedAt', () => new Date().toISOString()))
          );

          // 4. Build a summary string and validate the shape of the data
          fn(state => {
            const names = arrayToString(
              state.data.map(r => r.name),
              ', '
            );
            console.log(`Students: ${names}`);

            const schema = {
              type: 'object',
              required: ['id', 'name', 'score', 'passed'],
              properties: {
                id: { type: 'string' },
                name: { type: 'string' },
                score: { type: 'number' },
                passed: { type: 'boolean' },
              },
            };

            // Validate every row against the schema
            state.data.forEach(row => {
              const result = validate(schema, row);
              assert(
                result === true || (result && result.valid !== false),
                `Row failed schema validation: ${JSON.stringify(row)}`
              );
            });

            return state;
          });

          // 5. Define overall pass/fail criteria
          fn(state => {
            const passedCount = state.data.filter(r => r.passed).length;
            console.log(`${passedCount} of ${state.data.length} students passed`);

            assert(state.data.length === 3, 'Expected 3 rows from CSV');
            assert(passedCount === 2, 'Expected exactly 2 passing students');

            console.log('✅ CSV/validation test passed');
            return state;
          });

      Final-Summary-Log:
        name: Final Summary Log
        adaptor: '@openfn/language-common@latest'
        credential: null
        body: |
          // FINAL SUMMARY JOB
          // Uses the `common` adaptor. No credentials or input required.
          // Rolls up the accumulated state from previous steps and defines
          // overall pass/fail criteria via assert().

          fn((state) => {
            const startedAt = new Date().toISOString();
            console.log('=== OpenFn Platform Test Summary ===');
            console.log('Summary generated at:', startedAt);

            // Collect whatever previous steps left on state.
            const checks = [];

            const add = (name, passed, detail) => {
              checks.push({ name, passed: !!passed, detail: detail || '' });
            };

            // 1. State object exists and is usable
            add('state is an object', state && typeof state === 'object');

            // 2. Data was carried through the workflow
            add('state.data present', state.data !== undefined, `typeof=${typeof state.data}`);

            // 3. References from prior steps accumulated
            const refCount = Array.isArray(state.references) ? state.references.length : 0;
            add('has references from prior steps', refCount >= 0, `references=${refCount}`);

            // 4. No error leaked onto state
            add('no error on state', !state.error, state.error ? String(state.error) : 'clean');

            // Log the results table
            console.log('--- Checks ---');
            checks.forEach((c) => {
              console.log(`${c.passed ? 'PASS' : 'FAIL'} | ${c.name}${c.detail ? ' (' + c.detail + ')' : ''}`);
            });

            const passedCount = checks.filter((c) => c.passed).length;
            const failedCount = checks.length - passedCount;
            console.log(`--- Totals: ${passedCount} passed, ${failedCount} failed ---`);

            return {
              ...state,
              summary: {
                generatedAt: startedAt,
                passed: passedCount,
                failed: failedCount,
                checks,
              },
            };
          });

          // PASS/FAIL CRITERIA: fail the run if any check failed.
          assert(
            (state) => state.summary && state.summary.failed === 0,
            'Final summary detected one or more failed checks - see logs above'
          );

    triggers:
      webhook:
        type: webhook
        webhook_reply: before_start
        enabled: false
    edges:
      webhook->Validate-Input:
        source_trigger: webhook
        target_job: Validate-Input
        condition_type: always
        enabled: true
      Validate-Input->Make-HTTP-Request:
        source_job: Validate-Input
        target_job: Make-HTTP-Request
        condition_type: on_job_success
        enabled: true
      Validate-Input->Handle-Validation-Failure:
        source_job: Validate-Input
        target_job: Handle-Validation-Failure
        condition_type: on_job_failure
        enabled: true
      Make-HTTP-Request->Process-HTTP-Response:
        source_job: Make-HTTP-Request
        target_job: Process-HTTP-Response
        condition_type: on_job_success
        enabled: true
      Make-HTTP-Request->Handle-HTTP-Failure:
        source_job: Make-HTTP-Request
        target_job: Handle-HTTP-Failure
        condition_type: on_job_failure
        enabled: true
      Process-HTTP-Response->Final-Summary-Log:
        source_job: Process-HTTP-Response
        target_job: Final-Summary-Log
        condition_type: always
        enabled: true
  "Self-Testing-QA-Health-Check-(pasted-yaml)-2":
    name: 'Self-Testing QA Health Check (pasted yaml) 2'
    jobs:
      httpbin-get:
        name: httpbin-get
        adaptor: '@openfn/language-http@latest'
        credential: null
        body: |
          // QA health-check node: httpbin-get
          // - Sends a GET request to https://httpbin.org/get?qa=openfn
          // - Verifies the response echoes back the request (args + url present)
          // - Appends a result object to the shared state.qaResults array
          // - Never throws on failure: records passed:false so later checks still run

          fn(state => {
            const name = 'httpbin-get';
            const endpoint = 'https://httpbin.org/get?qa=openfn';

            // Ensure the shared results array exists without overwriting entries
            const qaResults = state.qaResults || [];

            // Run the request inside the callback so any failure (non-2xx or network
            // error) is caught here and never aborts the workflow.
            return get(endpoint)(state)
              .then(nextState => {
                let passed = false;
                let detail = '';

                const body = nextState.data || {};
                const echoedQa = body.args && body.args.qa === 'openfn';
                const echoedUrl =
                  typeof body.url === 'string' && body.url.includes('httpbin.org/get');
                passed = Boolean(echoedQa && echoedUrl);
                detail = passed
                  ? 'Response echoed args.qa=openfn and url as expected.'
                  : `Echo check failed. args=${JSON.stringify(body.args)}, url=${body.url}`;

                return {
                  ...nextState,
                  qaResults: [...qaResults, { name, endpoint, passed, detail }],
                };
              })
              .catch(error => {
                const res = error.response;
                let detail;
                if (res) {
                  // HTTP error: include status code, status message and body if present
                  const bodyText =
                    res.body !== undefined
                      ? JSON.stringify(res.body)
                      : res.data !== undefined
                      ? JSON.stringify(res.data)
                      : '(no body)';
                  detail = `HTTP ${res.status} ${res.statusText || ''}. Body: ${bodyText}`;
                } else {
                  // Network failure or other error with no HTTP response
                  detail = `Network error: ${error.message}`;
                }

                return {
                  ...state,
                  qaResults: [...qaResults, { name, endpoint, passed: false, detail }],
                };
              });
          });
      httpbin-post:
        name: httpbin-post
        adaptor: '@openfn/language-http@latest'
        credential: null
        body: |
          // Node: httpbin-post
          // Sends a POST to https://httpbin.org/post with a small JSON body.
          // Verifies the response's `json` field echoes back the body we sent.
          // Appends a QA result to the shared state.qaResults array (never overwrites).
          // Records passed:false on failure instead of throwing.

          const endpoint = 'https://httpbin.org/post';

          fn(state => {
            // ensure the shared array exists without overwriting existing entries
            const qaResults = state.qaResults || [];

            const body = { qa: 'openfn', ts: Date.now() };

            // Invoke the request inside fn so we can catch any failure.
            // A non-2xx response or a network error rejects here instead of
            // aborting the whole workflow.
            return post(endpoint, body)(state)
              .then(nextState => {
                // ---- success: keep the existing check logic ----
                const echoed = nextState.data && nextState.data.json;

                const passed =
                  !!echoed && echoed.qa === 'openfn' && typeof echoed.ts !== 'undefined';

                const result = {
                  name: 'httpbin-post',
                  endpoint,
                  passed,
                  detail: passed
                    ? 'Response json echoed the posted body.'
                    : `Echo mismatch: ${JSON.stringify(echoed)}`,
                };

                return { ...nextState, qaResults: [...qaResults, result] };
              })
              .catch(error => {
                // ---- failure: never throw, record passed:false ----
                const response = error && error.response;

                let detail;
                if (response) {
                  const bodyText =
                    typeof response.data === 'undefined'
                      ? ''
                      : ` Body: ${JSON.stringify(response.data)}`;
                  detail = `HTTP ${response.status} ${response.statusText || ''}.${bodyText}`.trim();
                } else {
                  detail = `Network error: ${(error && error.message) || String(error)}`;
                }

                const result = {
                  name: 'httpbin-post',
                  endpoint,
                  passed: false,
                  detail,
                };

                return { ...state, qaResults: [...qaResults, result] };
              });
          });
      httpbin-status:
        name: httpbin-status
        adaptor: '@openfn/language-http@latest'
        credential: null
        body: |
          // httpbin-status: QA health-check node
          // Sends a GET request to https://httpbin.org/status/200
          // Verifies the returned status code is 200
          // Appends a result object to the shared state.qaResults array (never overwrites existing entries)
          // Any HTTP failure (non-2xx or network error) is caught and recorded - it never aborts the run

          fn(state => {
            const name = 'httpbin-status';
            const endpoint = 'https://httpbin.org/status/200';

            // append exactly one entry to state.qaResults without overwriting existing ones
            const append = (s, result) => ({
              ...s,
              qaResults: [...(s.qaResults || []), result],
            });

            try {
              // parseAs 'text' so we can read the raw body even on failures
              return get(endpoint, { parseAs: 'text' })(state)
                .then(nextState => {
                  const status = nextState.response?.statusCode;
                  const passed = status === 200;
                  return append(nextState, {
                    name,
                    endpoint,
                    passed,
                    detail: passed
                      ? 'Returned expected status 200'
                      : `Expected status 200 but got ${status}`,
                  });
                })
                .catch(error => {
                  const response = error.response;
                  let detail;
                  if (response) {
                    // non-2xx HTTP response: include status code, status message and body
                    detail = `HTTP ${response.status} ${response.statusText || ''}`.trim();
                    if (response.data !== undefined && response.data !== null && response.data !== '') {
                      const body =
                        typeof response.data === 'string'
                          ? response.data
                          : JSON.stringify(response.data);
                      detail += ` - body: ${body}`;
                    }
                  } else {
                    // network / connection failure: no response, use the error message
                    detail = `Network error: ${error.message}`;
                  }
                  return append(state, { name, endpoint, passed: false, detail });
                });
            } catch (error) {
              // safety net: never throw
              return append(state, {
                name,
                endpoint,
                passed: false,
