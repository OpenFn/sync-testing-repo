id: scheduled-workflow-1
name: Scheduled workflow 1
start: cron
steps:
  - id: cron
    type: cron
    cron_expression: 0 0 * * *
    next:
      get-data:
        disabled: false
        condition: always
  - id: get-data
    name: Get data
    adaptor: '@openfn/language-http@latest'
    expression: ./get-data.js
