on:
  push:
    branches:
      - main
    # Only deploy when this project's workspace (or this file) changes
    paths:
      - '**'
      - '.github/workflows/openfn-f16dcb41-c3b0-44b1-a26c-1696a595dac9-deploy.yml'
  workflow_dispatch:
    inputs:
      force:
        description:
          'Deploy even if the project has changed in OpenFn since the last sync'
        type: boolean
        default: false

# Shared with openfn-pull.yml so a pull and a deploy never push to the same
# branch at once
concurrency:
  group: openfn-main
  cancel-in-progress: false

jobs:
  deploy-to-lightning:
    runs-on: ubuntu-latest
    name: Deploy project to OpenFn
    permissions:
      contents: write
    steps:
      - name: openfn deploy
        uses: openfn/cli-deploy-action@v2
        with:
          secret_input: ${{ secrets.OPENFN_f16dcb41_c3b0_44b1_a26c_1696a595dac9_API_KEY }}
          project_id_input: 'f16dcb41-c3b0-44b1-a26c-1696a595dac9'
          endpoint_input: 'https://app.staging.openfn.org'
          workspace_input: '.'
          # A commit with [openfn force] in its message forces the deploy too
          force_input:
            ${{ inputs.force || contains(github.event.head_commit.message,
            '[openfn force]') }}
