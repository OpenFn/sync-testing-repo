on:
  push:
    branches:
      - main

concurrency:
  group: openfn-deployment
  cancel-in-progress: false

jobs:
  deploy-to-lightning:
    runs-on: ubuntu-latest
    name: A job to deploy to Lightning
    permissions:
      contents: write
    steps:
      - name: openfn deploy
        uses: openfn/cli-deploy-action@v1
        with:
          secret_input: ${{ secrets.OPENFN_1a4aed53_5432_4850_b394_0a22d0512394_API_KEY }}
          config_path_input: 'openfn-1a4aed53-5432-4850-b394-0a22d0512394-config.json'
